<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      .activity-participants {
        margin-top: 1rem;
        padding: 0.85rem 1rem;
        border-radius: 0.75rem;
        background: #f3f6fb;
      }

      .activity-participants h4 {
        margin: 0 0 0.5rem;
        color: #243b53;
        font-size: 0.95rem;
      }

      .activity-participants ul {
        margin: 0;
        padding-left: 1.25rem;
        color: #486581;
      }

      .activity-participants li + li {
        margin-top: 0.25rem;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Mergington High School</h1>
      <h2>Extracurricular Activities</h2>
    </header>

    <main>
      <section id="activities-container">
        <h3>Available Activities</h3>
        <div id="activities-list">
          <!-- Activities will be loaded here -->
          <p>Loading activities...</p>
        </div>
        <template id="activity-participants-template">
          <section class="activity-participants" aria-label="Activity participants">
            <h4>Participants</h4>
            <ul></ul>
          </section>
        </template>
      </section>

      <section id="signup-container">
        <h3>Sign Up for an Activity</h3>
        <form id="signup-form">
          <div class="form-group">
            <label for="email">Student Email:</label>
            <input type="email" id="email" required placeholder="your-email@mergington.edu" />
          </div>
          <div class="form-group">
            <label for="activity">Select Activity:</label>
            <select id="activity" required>
              <option value="">-- Select an activity --</option>
              <!-- Activity options will be loaded here -->
            </select>
          </div>
          <button type="submit">Sign Up</button>
        </form>
        <div id="message" class="hidden"></div>
      </section>
    </main>

    <footer>
      <p>&copy; 2023 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
